<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>智慧体育云平台</title>
    <style>
      #browser-upgrade { display: block; max-width: 44rem; margin: 10vh auto; padding: 24px; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.8; }
      #browser-upgrade[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main id="browser-upgrade" hidden>
      <p>智慧体育云平台</p>
      <h1>请升级浏览器后继续使用</h1>
      <p>当前浏览器缺少页面运行所需的能力，或无法识别内核版本。请更新浏览器或手机系统，再重新打开平台。</p>
      <!-- 浏览器版本列表由入口插件按统一配置生成。 -->
      <p>iPhone / iPad 的微信内置浏览器随系统更新，请使用 iOS / iPadOS 16.4 或更新版本。Android 微信请先更新微信；仍无法打开时，可在右上角菜单选择在新版系统浏览器中打开。</p>
      <p>请使用浏览器的“帮助 / 关于”功能检查更新，或在新版浏览器中重新打开当前平台地址。</p>
    </main>
    <noscript><p>请启用 JavaScript，再重新打开智慧体育云平台。</p></noscript>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
