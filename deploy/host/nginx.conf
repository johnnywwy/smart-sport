worker_processes 1;
pid /mnt/data/smart-sport-m1/shared/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }
http {
    include /mnt/data/smart-sport-m1/runtime/nginx/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_body_temp_path /mnt/data/smart-sport-m1/shared/nginx/client;
    proxy_temp_path /mnt/data/smart-sport-m1/shared/nginx/proxy;
    fastcgi_temp_path /mnt/data/smart-sport-m1/shared/nginx/fastcgi;
    uwsgi_temp_path /mnt/data/smart-sport-m1/shared/nginx/uwsgi;
    scgi_temp_path /mnt/data/smart-sport-m1/shared/nginx/scgi;
    server {
        listen 127.0.0.1:18082;
        server_name sport.johnnywwy.com;
        root /mnt/data/smart-sport-m1/current/web;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-zRs9tYOfylSy0Rk4zduEsJt85jVhz5xHOKyDCquhQBw='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        location ~ /\. { deny all; }
        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
        location /health/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
        }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { try_files $uri $uri/ /index.html; expires -1; }
    }
}
